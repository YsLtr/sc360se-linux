name: C/C++ CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Build CLI
        run: make clean all

      - name: Run protocol tests
        run: make test

      - name: Check GUI syntax
        run: python3 -m py_compile gui/sc360se-gui

      - name: Check whitespace errors
        run: git diff --check

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Build release packages
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          cliroot="$PWD/pkgroot-cli"
          guiroot="$PWD/pkgroot-gui"
          mkdir -p dist

          make clean all
          make test
          python3 -m py_compile gui/sc360se-gui
          make DESTDIR="$cliroot" PREFIX=/usr install
          make DESTDIR="$guiroot" PREFIX=/usr install-gui

          for root in "$cliroot" "$guiroot"; do
            cp packaging/install.sh "$root/install.sh"
            chmod +x "$root/install.sh"
            cp packaging/uninstall.sh "$root/uninstall.sh"
            chmod +x "$root/uninstall.sh"
            cp packaging/README-install.txt "$root/README-install.txt"
          done

          tar -C "$cliroot" -czf "dist/sc360se-linux-${version}-cli-x86_64.tar.gz" .
          tar -C "$guiroot" -czf "dist/sc360se-linux-${version}-gui-x86_64.tar.gz" .
          sha256sum dist/sc360se-linux-${version}-*.tar.gz > "dist/SHA256SUMS"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/sc360se-linux-*-cli-x86_64.tar.gz
            dist/sc360se-linux-*-gui-x86_64.tar.gz
            dist/SHA256SUMS
